<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ผู้เรียน · DIGITAL SURVIVAL</title>
  <meta name="theme-color" content="#070E1C">
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('ds-theme')||'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/student.css">
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <a class="brand" href="index.html">
      <span class="brand__logo"><span data-icon="shield"></span></span>
      <span class="brand__txt"><b>DIGITAL SURVIVAL</b><small>ผู้เรียน · Player</small></span>
    </a>
    <div class="app-header__right">
      <span class="role-chip"><span data-icon="id"></span> <b id="hdrPid" style="color:var(--text)">P——</b> <small>player</small></span>
      <button class="ds-iconbtn" data-role="theme-toggle" type="button" aria-label="สลับธีมสว่าง/มืด" title="สลับธีม">
        <span class="icon-sun" data-icon="sun"></span><span class="icon-moon" data-icon="moon"></span>
      </button>
    </div>
  </header>

  <main class="app-main ds-wrap">
    <!-- Digital Passport -->
    <section class="ds-card passport ds-fade-up" aria-label="บัตรผ่านดิจิทัล">
      <div class="passport__top">
        <div>
          <p class="ds-en" style="color:var(--cyan)">Digital Passport</p>
          <h2 class="passport__name"><span id="pName">รอเข้าร่วม…</span></h2>
          <p class="ds-pid"><span id="pPid">P——</span><span class="ds-muted" id="pRoom"></span></p>
        </div>
        <div style="text-align:right">
          <div class="ds-stat__num ds-stat__num--xp" id="pXp">0</div>
          <div class="ds-stat__label">คะแนน XP</div>
        </div>
      </div>
      <div class="passport__level">
        <span class="ds-chip"><span data-icon="sparkles"></span> <span id="pLevelNo">เลเวล 01</span> · <span id="pLevelName">มือใหม่ดิจิทัล</span> <span class="ds-en" id="pLevelEn">Digital Rookie</span></span>
      </div>
      <div style="margin-top:16px">
        <div class="ds-stat__label" style="margin-bottom:8px" id="pProgressLabel">ความคืบหน้าภารกิจ · 0 / 8</div>
        <div class="ds-segbar" id="progressBar">
          <i class="ds-segbar__seg"></i><i class="ds-segbar__seg"></i><i class="ds-segbar__seg"></i><i class="ds-segbar__seg"></i>
          <i class="ds-segbar__seg"></i><i class="ds-segbar__seg"></i><i class="ds-segbar__seg"></i><i class="ds-segbar__seg"></i>
        </div>
      </div>
    </section>

    <!-- Live area — swaps between waiting room / mission intro / question / result -->
    <section class="ds-card stage" style="margin-top:20px; min-height:300px" id="stage" aria-live="polite">
      <div class="ds-empty">
        <span class="ds-feat ds-feat--violet ds-ico--lg"><span data-icon="network"></span></span>
        <h3>ห้องรอ <span class="ds-en" style="display:block;margin-top:4px">Waiting Room</span></h3>
        <p>กำลังโหลด…</p>
      </div>
    </section>

    <!-- Badge collection -->
    <section class="ds-card" style="margin-top:20px">
      <div class="ds-heading"><span class="ds-en">Badge Collection</span><h2>เหรียญตราที่สะสม</h2></div>
      <div class="badge-grid" id="badgeGrid"></div>
    </section>
  </main>

  <footer class="app-footer">
    <span class="ds-status is-wait" id="connStatus"><span class="ds-status__dot"></span><span>กำลังเชื่อมต่อ…</span></span>
    <a href="index.html">ออกจากภารกิจ <span class="ds-en">Leave</span></a>
  </footer>
</div>

<script type="module" src="js/ui.js"></script>
<script type="module" src="js/student.js"></script>
</body>
</html>
