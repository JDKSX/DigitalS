<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ทดสอบการเชื่อมต่อ · DIGITAL SURVIVAL</title>
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('ds-theme')||'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <a class="brand" href="index.html"><span class="brand__logo"><span data-icon="shield"></span></span>
      <span class="brand__txt"><b>DIGITAL SURVIVAL</b><small>ตรวจการเชื่อมต่อ · Firebase test</small></span></a>
    <button class="ds-iconbtn" data-role="theme-toggle" type="button" aria-label="สลับธีม">
      <span class="icon-sun" data-icon="sun"></span><span class="icon-moon" data-icon="moon"></span></button>
  </header>

  <main class="app-main ds-wrap" style="max-width:600px">
    <div class="ds-card">
      <div class="ds-heading"><span class="ds-en">Connection self-test</span><h2>ตรวจสอบการตั้งค่า Firebase</h2></div>
      <p class="ds-muted" style="margin-bottom:18px">ใช้ยืนยันว่าใส่ config + เปิด Auth + สร้าง Firestore + วาง Rules ถูกต้อง ก่อนวันงานจริง</p>
      <ol id="steps" style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px">
        <li class="ds-status is-wait" data-step="config"><span class="ds-status__dot"></span><span>1. ตรวจ Firebase config</span></li>
        <li class="ds-status is-wait" data-step="auth"><span class="ds-status__dot"></span><span>2. เข้าสู่ระบบแบบ Anonymous</span></li>
        <li class="ds-status is-wait" data-step="read"><span class="ds-status__dot"></span><span>3. อ่าน Firestore (sessions)</span></li>
      </ol>
      <button class="ds-btn ds-btn--primary ds-btn--block" id="run" type="button" style="margin-top:22px">เริ่มทดสอบ</button>
      <pre id="log" class="ds-mono" style="margin-top:18px;font-size:.78rem;color:var(--text-muted);white-space:pre-wrap;word-break:break-word"></pre>
    </div>
  </main>
</div>

<script type="module" src="js/ui.js"></script>
<script type="module">
  import { firebaseConfig } from './js/firebase.js';
  const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
  const set = (step, ok, msg) => {
    const li = document.querySelector(`[data-step="${step}"]`);
    li.className = 'ds-status ' + (ok ? 'is-ok' : 'is-err');
    if (msg) li.lastElementChild.textContent = li.lastElementChild.textContent.replace(/:.*/,'') + ': ' + msg;
  };

  document.getElementById('run').addEventListener('click', async () => {
    document.getElementById('log').textContent = '';
    // 1. config
    if (!firebaseConfig || firebaseConfig.apiKey === 'REPLACE_ME') {
      set('config', false, 'ยังไม่ได้ใส่ config'); log('❌ แก้ js/firebase.js ใส่ค่าจริงจาก Firebase Console ก่อน'); return;
    }
    set('config', true); log('✅ พบ config: ' + firebaseConfig.projectId);

    // 2. anonymous auth
    let uid;
    try {
      const { ensureStudentAuth } = await import('./js/auth.js');
      const u = await ensureStudentAuth(); uid = u.uid;
      set('auth', true); log('✅ Anonymous uid: ' + uid);
    } catch (e) { set('auth', false, 'ล้มเหลว'); log('❌ Auth: ' + (e.code || e.message) + '\n→ เปิด Authentication → Sign-in method → Anonymous'); return; }

    // 3. firestore read
    try {
      const { findSessionByCode } = await import('./js/session.js');
      await findSessionByCode('__TEST__'); // expected: no result, but read must succeed
      set('read', true); log('✅ อ่าน Firestore ได้ (rules ผ่าน)');
      log('\n🎉 พร้อมใช้งาน! ไปทดสอบ join จริงที่หน้าแรกได้เลย');
    } catch (e) { set('read', false, 'ล้มเหลว'); log('❌ Firestore: ' + (e.code || e.message) + '\n→ สร้าง Firestore Database + วาง firestore.rules'); }
  });
</script>
</body>
</html>
