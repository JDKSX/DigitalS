<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>แผงคุมเกม · JDKS Arena</title>
  <meta name="theme-color" content="#241540">
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('ds-theme')||'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;600;700&family=JetBrains+Mono:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/arena.css">
  <link rel="stylesheet" href="css/arena-game.css">
  <link rel="stylesheet" href="css/host.css">
</head>
<body class="hx">

  <!-- ══ แถบบน: ตัวตนห้อง + ทางออก ══ -->
  <header class="hx-bar hx-bar--top">
    <a class="hx-brand" href="teacher.html" title="กลับแผงของฉัน">
      <span class="hx-brand__mark">JA</span>
      <span class="hx-brand__txt">JDKS <b>Arena</b><small>แผงคุมเกม</small></span>
    </a>

    <button class="hx-room" id="codeChip" type="button" title="แตะเพื่อคัดลอกรหัสห้อง">
      <span class="hx-room__l">รหัสห้อง</span>
      <b id="codeVal">—————</b>
      <span class="hx-room__cp" data-icon="copy" aria-hidden="true"></span>
    </button>

    <div class="hx-bar__sp"></div>

    <a class="hx-tool" id="presenterLink" href="presenter.html" target="_blank" rel="noopener" title="เปิดจอฉาย">
      <span data-icon="monitor"></span><span class="hx-tool__t">จอฉาย</span>
    </a>
    <div class="jx-menu-wrap">
      <button class="hx-tool" id="moreBtn" type="button" aria-haspopup="menu" aria-expanded="false" title="ตัวเลือกเพิ่มเติม">
        <span data-icon="dots"></span>
      </button>
      <div class="jx-menu hx-menu" id="moreMenu" role="menu" hidden>
        <button role="menuitem" type="button" id="announceBtn"><span data-icon="trophy"></span> ประกาศผลรวม</button>
        <button role="menuitem" type="button" id="endSession"><span data-icon="flag"></span> จบกิจกรรม</button>
        <button role="menuitem" type="button" id="newSession"><span data-icon="plus"></span> เปิดห้องใหม่</button>
      </div>
    </div>
    <button class="hx-tool" data-role="theme-toggle" type="button" aria-label="สลับธีม" title="สลับธีม">
      <span class="icon-sun" data-icon="sun"></span><span class="icon-moon" data-icon="moon"></span>
    </button>
  </header>

  <!-- ══ พื้นที่ทำงาน 3 คอลัมน์ ══ -->
  <main class="hx-main">

    <!-- รางภารกิจ -->
    <aside class="hx-rail" aria-label="ภารกิจ">
      <div class="hx-rail__h">ภารกิจ</div>
      <div class="hx-rail__list" id="missionRail">
        <div class="hx-skel"></div><div class="hx-skel"></div><div class="hx-skel"></div>
      </div>
    </aside>

    <!-- เวทีกลาง: สิ่งที่ครูกำลังพูดถึง -->
    <section class="hx-stage" id="centerStage">
      <div class="hx-boot">
        <div class="qx-dots"><i></i><i></i><i></i></div>
        <p>กำลังเตรียมแผงควบคุม…</p>
      </div>
    </section>

    <!-- รางข้อมูลสด -->
    <aside class="hx-live" aria-label="ข้อมูลสด">
      <div class="hx-live__row" id="statBox">
        <div class="hx-kpi"><b class="hx-stat__n">0</b><span>ออนไลน์</span></div>
        <div class="hx-kpi"><b class="hx-stat__n">0</b><span>เข้าร่วม</span></div>
        <div class="hx-kpi hx-kpi--ans"><b class="hx-stat__n">0</b><span>ตอบแล้ว</span></div>
        <div class="hx-kpi hx-kpi--xp"><b class="hx-stat__n">0</b><span>XP เฉลี่ย</span></div>
      </div>

      <div class="hx-panel">
        <div class="hx-panel__h">คำตอบตอนนี้<small>สีตรงกับจอนักเรียน</small></div>
        <div id="distList" class="hx-panel__b">
          <p class="hx-none">ยังไม่ได้เปิดคำถาม</p>
        </div>
      </div>

      <div class="hx-panel hx-panel--grow">
        <div class="hx-panel__h">อันดับคะแนน<small>10 อันดับแรก</small></div>
        <div id="lbList" class="hx-panel__b"><p class="hx-none">ยังไม่มีคะแนน</p></div>
      </div>
    </aside>
  </main>

  <!-- ══ แถบล่าง: ปุ่มคุมเกม ══ -->
  <footer class="hx-bar hx-bar--bottom" role="toolbar" aria-label="ควบคุมเกม">
    <button class="qb qb--start" data-act="start" disabled><span class="qb__ic" data-icon="play"></span><span class="qb__t">เริ่ม</span></button>
    <button class="qb" data-act="lock" disabled><span class="qb__ic" data-icon="lock"></span><span class="qb__t">ล็อก</span></button>
    <button class="qb" data-act="explain" disabled><span class="qb__ic" data-icon="bulb"></span><span class="qb__t">เฉลย</span></button>
    <button class="qb" data-act="results" disabled><span class="qb__ic" data-icon="trophy"></span><span class="qb__t">ผลคะแนน</span></button>
    <button class="qb qb--next" data-act="next" disabled><span class="qb__ic" data-icon="next"></span><span class="qb__t">ถัดไป</span></button>
  </footer>

<script type="module" src="js/ui.js"></script>
<script type="module" src="js/mascot.js"></script>
<script type="module" src="js/host.js"></script>
</body>
</html>
